[project]
name = "chunkhound-index-commons"
version = "0.1.0"
description = "Shared DuckDB / ChunkHound index primitives: directory resolution, schema inspection, SQL-interpolation safety, vss/HNSW handling"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{ name = "Martin Bens", email = "martin.bens@it-bens.de" }]
keywords = ["duckdb", "chunkhound", "hnsw", "vector-index", "library"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "duckdb>=1.4.0,<1.5.3.dev0",
    "duckdb-extension-vss>=1.5.2",
]

[project.urls]
Homepage = "https://github.com/it-bens/chunkhound-index-commons"
Repository = "https://github.com/it-bens/chunkhound-index-commons"
Issues = "https://github.com/it-bens/chunkhound-index-commons/issues"

[project.optional-dependencies]
dev = [
    "mypy>=2.1",
    "pre-commit>=4.5",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "typos>=1.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chunkhound_index_commons"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/", ".github/", ".claude/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["chunkhound_index_commons"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb_extension_vss"]
ignore_missing_imports = true
